<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mat &amp; Méthode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plan : outil de labo, thème sombre unique (vert d'eau sur noir verdâtre), ambre réservé aux prélèvements et aux champs à saisir.
   Mise en page : en-tête, onglets, bandeau de contexte (donneur d'ordre), vue de travail ; une colonne sur téléphone. */
:root{
  --bg:#0F1715; --rail:#131D1A; --panel:#17231F; --panel2:#1D2B26; --line:#2C3D37;
  --ink:#E6EFEC; --muted:#9DB0AA; --soft:#C5D4CF;
  --accent:#5FD0B5; --on-accent:#06231C; --accent-soft:#8FE3CE; --chip:#1F4A40; --chip-ink:#BFF0E3; --seg:#2F5A4F;
  --amber:#F0B35A; --amber-bg:#3A2C12; --amber-line:#B8862F; --danger:#F29B8E;
  --field:#0F1715; --field-line:#6F857E;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{min-height:100%;display:flex;flex-direction:column}

/* en-tête */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;background:var(--rail);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.top .name{flex:1 1 220px;min-width:0}
.top .name input{width:100%;height:44px;border:1px solid transparent;background:transparent;border-radius:8px;padding:0 10px;font-weight:600;font-size:16px}
.top .name input:hover,.top .name input:focus{border-color:var(--field-line);background:var(--field)}
.savestate{font:400 12px/1.35 var(--mono);color:var(--muted);text-align:right}
.lanc{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--panel)}.lanc.on{border:1px solid var(--accent)}
.jr{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}.jr .mono{color:var(--muted);font-size:12px}.jr b{color:var(--accent-soft)}.jwrap{max-height:52vh;overflow:auto;margin:8px 0}
.tabs{display:flex;gap:4px;padding:8px 16px;background:var(--rail);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:none;height:44px;padding:0 16px;border-radius:10px;border:0;background:transparent;color:var(--soft);font-weight:500;white-space:nowrap}
.tab[aria-current="page"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.tab:disabled{opacity:.45;cursor:default}

/* contexte */
.ctx{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;padding:12px 16px;background:var(--rail);border-bottom:1px solid var(--line)}
.ctx .fld{flex:1 1 150px;max-width:260px}
.ctx>[data-region]{margin-left:auto}
.ctx .info{font:400 13px var(--mono);color:var(--soft);padding-bottom:12px}
.mrow>.fld{width:44px;height:44px;align-items:center;justify-content:center}

/* champs */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>label,.lbl{font-size:12.5px;font-weight:500;color:var(--soft)}
.in,.fld input,.fld select,.fld textarea,.ta{width:100%;min-height:44px;border:1px solid var(--field-line);border-radius:8px;padding:0 12px;background:var(--field);color:var(--ink)}
.fld textarea,.ta{padding:10px 12px;min-height:88px;line-height:1.5;resize:vertical}
.mono{font-family:var(--mono);font-size:14px}
.fld input[type=checkbox]{width:18px;min-height:18px;height:18px;accent-color:var(--accent)}
.fld input:disabled,.fld select:disabled{opacity:.5}

/* boutons */
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--field-line);background:transparent;color:var(--ink);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.accent{border-color:var(--accent);color:var(--accent-soft)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:40px;padding:0 12px;font-size:13.5px;border-radius:8px}
.btn.icon{width:44px;padding:0}
.btn.dash{border-style:dashed}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 14px;border-radius:9px;border:0;background:transparent;color:var(--soft);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--seg);color:var(--ink);font-weight:600}

/* vues */
.view{flex:1;padding:16px;display:flex;flex-direction:column;gap:16px;max-width:1500px;width:100%;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>h2,.panel .ph2{font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* pastilles, badges */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--panel2);color:var(--soft);border:1px solid var(--line)}
.chip.ok{background:var(--chip);color:var(--chip-ink);border-color:transparent}
.chip.warn{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.chip.info{background:#1B3045;color:#A9CCF2;border-color:#3F6A96}
.chip.danger{background:#43201C;color:var(--danger);border-color:#A5594F}
.dtag{--h:172;display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font:600 12.5px var(--sans);background:hsl(var(--h) 42% 22%);color:hsl(var(--h) 75% 80%);border:1px solid hsl(var(--h) 40% 38%)}
button.dtag{cursor:pointer;min-height:34px;padding:0 12px}button.dtag[aria-pressed=true]{background:hsl(var(--h) 50% 34%);border-color:hsl(var(--h) 70% 70%);box-shadow:0 0 0 1px hsl(var(--h) 70% 70%)}
.tagp{display:inline-flex;align-items:center;padding:1px 9px;border-radius:6px;font-size:12px;background:var(--panel2);color:var(--soft);border:1px solid var(--line)}button.tagp{cursor:pointer}button.tagp:hover{border-color:var(--accent)}
.frow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}.frow .lbl{margin-right:2px}
.tgs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}textarea.ctx{min-height:74px;width:100%}
.todo,.ph{display:inline-block;padding:0 7px;border-radius:6px;border:1px dashed var(--amber-line);background:var(--amber-bg);color:var(--amber);font-size:.88em}
.badge{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--amber);color:#2B1B00;font:600 11px var(--mono);flex:none}
.badge.sm{width:18px;height:18px;font-size:10.5px}

/* bibliothèque */
.mlist{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.mrow.on{border-color:var(--accent)}
.mrow .nm{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.mrow .meta{font-size:13px;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}
.mrow .acts{grid-column:1 / 3;display:flex;flex-wrap:wrap;gap:8px}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--accent);border-radius:12px;background:var(--chip)}
.bulk b{margin-right:auto}

/* flux */
.flowwrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start}
.palette{display:flex;flex-direction:column;gap:6px;position:sticky;top:8px}
.palette .btn{justify-content:space-between;background:var(--panel);border-color:var(--line)}
.cards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 10px}
.cards>.card{flex:0 0 240px;scroll-snap-align:start}
@media (min-width:981px){.cards{flex-wrap:wrap;overflow:visible}.cards>.card{flex:1 1 235px;max-width:320px}}
.card{position:relative;display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;min-width:0}
.card.sel{border:2px solid var(--accent);padding:11px;background:var(--panel2)}
.card.entry{cursor:default;border-style:dashed}
.card header{display:flex;align-items:center;gap:8px}
.card>h3{flex:none}
.card h3{font-size:15px;font-weight:600;flex:1;min-width:0;overflow-wrap:break-word;word-break:normal;hyphens:manual;line-height:1.2}
.num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:600 12.5px var(--mono);flex:none}
.cfoot{display:flex;align-items:center;gap:8px;margin-top:4px}
.cfoot .mv{margin-left:auto;display:flex;gap:2px}
.card .mv button{width:40px;height:40px;border-radius:8px;border:0;background:transparent;color:var(--soft);font-size:18px}
.card .mv button:hover:not(:disabled){background:var(--line)}
.card .mv button:disabled{opacity:.35;cursor:default}
.reac{font:600 13px var(--sans);color:var(--ink)}
.par{font:400 12.5px var(--mono);color:var(--accent-soft);overflow-wrap:anywhere}
.eq{font-size:12.5px;color:var(--muted)}
.frise{position:relative;height:42px;margin:6px 4px 0}
.frise .track{position:absolute;left:0;right:0;top:15px;height:3px;border-radius:2px;background:#3E6B5F}
.frise .badge{position:absolute;top:6px;margin-left:-10px}
.frise .t0,.frise .t1{position:absolute;top:26px;font:400 10.5px var(--mono);color:var(--muted)}
.frise .t0{left:0}.frise .t1{right:0}
.pills{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pill{display:flex;align-items:center;gap:8px;min-height:36px;padding:3px 10px 3px 6px;border-radius:8px;border:1px solid var(--amber-line);background:var(--amber-bg);color:var(--amber);font:500 12.5px var(--mono);text-align:left}
.pill small{font:400 11.5px var(--sans);color:var(--soft)}
.addp{align-self:flex-start;min-height:36px;padding:0 10px;border-radius:8px;border:1px dashed var(--field-line);background:transparent;color:var(--soft);font:400 12.5px var(--mono)}
.timebar{display:flex;gap:3px;height:26px}
.timebar>div{border-radius:5px;background:var(--seg);display:grid;place-items:center;font:400 11px var(--mono);min-width:2px;overflow:hidden}
.timebar>div.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12.5px;color:var(--soft)}
.insp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.rrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.2fr) minmax(0,1fr) auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipx{display:inline-flex;align-items:center;gap:2px;min-height:36px;padding:0 4px 0 12px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font-size:13px}
.chipx button{width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--chip-ink)}
.phrase{padding:12px 14px;border-radius:10px;background:var(--bg);font-size:14px;line-height:1.7}

/* échantillons */
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.scard{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.scard.sel{border:2px solid var(--accent);padding:13px}
.scard>header{display:flex;align-items:center;gap:10px}
.scard .sid{font:600 16px var(--mono);color:var(--amber)}
.tgl{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--field-line);background:transparent;color:var(--soft);font-size:13.5px}
.tgl[aria-pressed="true"]{background:var(--chip);border-color:var(--accent);color:var(--chip-ink)}
.bar{display:flex;gap:3px;height:26px}
.bar>div{border-radius:5px;min-width:2px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--rail);text-align:left;font:500 12px var(--mono);color:var(--muted);padding:10px 12px;white-space:nowrap}
td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:middle}
td input{min-width:120px;min-height:44px}
.tw.read td{padding:10px 12px}

/* texte */
.doc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;max-width:820px}
.doc h2{font-size:20px}.doc h3{font-size:15px;margin-top:6px}
.doc p{line-height:1.75;max-width:70ch}

/* modale, toast */
.ov{position:fixed;inset:0;background:rgba(5,10,9,.7);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{width:min(640px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--field-line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:18px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);font-weight:600;padding:10px 18px;border-radius:999px;z-index:30;display:none;max-width:90vw}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}

.seg.big{display:flex;width:100%}.seg.big button{flex:1;min-height:52px;font-size:15px}
.btn.big{min-height:52px;font-size:16px;width:100%}
.defl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.defl li{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.defl .top{display:flex;align-items:center;gap:10px}
.defl .btns{display:flex;flex-wrap:wrap;gap:6px}
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.q{font-size:16px;margin-top:6px}
.conds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cond{display:flex;flex-direction:column;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.tgl.big{min-height:48px;font-size:15px;font-weight:600;justify-content:flex-start;width:100%}
.editor{display:flex;flex-direction:column;gap:14px;scroll-margin-top:8px}
.eh{font-size:22px;display:flex;align-items:center;gap:10px}
.nav{display:flex;gap:10px}.nav .btn{flex:1;min-height:52px}
details.more>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--soft);font-size:13.5px}
details.more[open]>summary{margin-bottom:8px}
.ctitle{display:block;max-width:100%;background:none;border:0;padding:0;font:inherit;line-height:inherit;overflow-wrap:break-word;white-space:normal;font-weight:600;color:inherit;text-align:left;cursor:pointer}
.todo-line{font-size:12.5px;color:var(--amber)}
.phr{padding:8px 0;border-top:1px solid var(--line)}
.rrow.r3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
@media (max-width:980px){
  .flowwrap{grid-template-columns:minmax(0,1fr)}
  .palette{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .palette .btn{flex:none}
  .insp{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .rrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .rrow>.fld:first-child{grid-column:1 / 3}
  .rrow.r3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
  .rrow.r3>.fld:first-child{grid-column:auto}
  .conds{grid-template-columns:minmax(0,1fr)}
  .scards{grid-template-columns:minmax(0,1fr)}
  .view{padding:12px}
  .ctx .fld{max-width:none}
  .ctx .info{margin-left:0;padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Cette page demande JavaScript.</noscript>

<script>
'use strict';
/* ====================== utilitaires ====================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const nowIso = () => new Date().toISOString();
const num = v => { if (v === '' || v == null) return null; const n = Number(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; };
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const fmtVol = v => v == null ? '?' : Number(v).toLocaleString('fr-FR');
const fmtDur = m => { if (m == null) return ''; m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; if (!h) return m + ' min'; return r ? `${h} h ${String(r).padStart(2, '0')}` : `${h} h`; };
const fmtDT = iso => { try { const d = new Date(iso); return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }) + ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
const who = m => (m && m.contexte && m.contexte.operateur && m.contexte.operateur.trim()) || 'Opérateur';
const fmtDate = iso => { try { return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); } catch (e) { return ''; } };
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const lowerFirst = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : s;
const clone = o => JSON.parse(JSON.stringify(o));
const list = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' et ' + a[a.length - 1];
const de = s => /^[aeiouyhéèêàâîôû]/i.test(s) ? 'd’' + s : 'de ' + s;

/* ====================== données ====================== */
const OPS = {
  'chauffage': { part: 'chauffé', d: { temperature: 60, duree: 30, agitation: 300, equipement: ['Plaque chauffante agitatrice'] } },
  'filtration': { part: 'filtré', d: { filtre: 5, duree: 10, vide: { mbar: null }, equipement: ['Entonnoir Büchner', 'Fiole à vide', 'Membrane 5 µm'] } },
  'désacidification': { part: 'désacidifié', d: { temperature: 25, duree: 15, agitation: 300, equipement: ['Ampoule à décanter 500 mL'], reactifs: [{ nom: 'Éthanol 96 %', quantite: '1 : 1 (v/v)', role: 'Solvant' }] } },
  'décantation': { part: 'décanté', d: { temperature: 40, duree: 120, equipement: ['Ampoule à décanter 500 mL'] } },
  'séchage': { part: 'séché', d: { temperature: 105, duree: 60, equipement: ['Étuve'] } },
  'centrifugation': { part: 'centrifugé', d: { agitation: 4000, duree: 10, equipement: ['Centrifugeuse'] } },

        <button class="btn sm" data-act="exp" data-id="${m.id}">Exporter</button><button class="btn sm" data-act="arch" data-id="${m.id}">${m.statut === 'archivee' ? 'Restaurer' : 'Archiver'}</button>${m.statut === 'archivee' ? `<button class="btn sm danger" data-act="del" data-id="${m.id}">Supprimer</button>` : ''}</div>
    </div>`; }).join('') : `<div class="empty">${arch ? 'Aucune manip archivée.' : 'Aucune manip. Crée-en une avec « Nouvelle manip ».'}</div>`}</div>
  <div class="row hint"><button class="btn sm" data-act="open-import">Importer un ancien rapport</button><button class="btn sm" data-act="reset">Restaurer les exemples</button></div>`;
}

/* ---- flux : aperçu visuel ---- */
function friseHtml(e, ps, L) {
  if (!e.duree && !ps.length) return '';
  const badges = ps.map(p => { const pct = p.moment === 'pendant' && e.duree && p.temps != null ? Math.max(0, Math.min(100, p.temps / e.duree * 100)) : p.moment === 'pendant' ? 50 : 100; return `<span class="badge" style="left:${pct}%">${esc(codeOf(L[p.id]))}</span>`; }).join('');
  return `<div class="frise" role="img" aria-label="Frise de l’étape, ${e.duree ? fmtDur(e.duree) : 'durée inconnue'}"><div class="track"></div>${badges}<span class="t0">0</span><span class="t1">${e.duree ? fmtDur(e.duree) : 'fin'}</span></div>`;
}
REG.flow = m => {
  const L = labels(m), S_ = sortedSamples(m);
  const pill = p => `<span class="pill"><span class="badge sm">${esc(codeOf(L[p.id]))}</span>${esc(L[p.id])} · ${fmtVol(p.volume)} mL <small>${p.moment === 'avant' ? 'avant' : p.moment === 'pendant' ? 'à ' + (p.temps != null ? fmtDur(p.temps) : '?') : 'sortie'}</small></span>`;
  const sel = id => S.ui.stepId === id ? 'sel' : '';
  const dep = S_.filter(p => sampleStepNo(m, p) === 0);
  const depart = `<article class="card entry ${sel(DEPART)}" data-act="go-step" data-id="${DEPART}"><h3><button class="ctitle" data-act="go-step" data-id="${DEPART}">Départ</button></h3>
    <div class="eq">${esc(m.contexte.matiere || 'matière ?')}${m.contexte.volumeDepart != null ? ' · ' + fmtVol(m.contexte.volumeDepart) + ' mL' : ''}</div><div class="pills">${dep.map(pill).join('')}</div></article>`;
  const cards = m.etapes.map((e, i) => {
    const ps = S_.filter(p => p.etapeId === e.id), par = condSummary(e);
    return `<article class="card ${sel(e.id)}" data-act="go-step" data-id="${e.id}"><header><span class="num">${i + 1}</span><h3><button class="ctitle" data-act="go-step" data-id="${e.id}">${esc(cap(e.operation))}</button></h3></header>
      ${e.reactifs.filter(r => r.nom).map(r => `<div class="reac">${esc(r.nom)}${r.quantite ? ` <span class="eq">${esc(r.quantite)}</span>` : ''}</div>`).join('')}
      ${par ? `<div class="par">${esc(par)}</div>` : '<div class="todo-line">conditions à compléter</div>'}
      ${e.equipement.length ? `<div class="eq">${esc(e.equipement.join(' · '))}</div>` : ''}
      ${friseHtml(e, ps, L)}<div class="pills">${ps.map(pill).join('')}</div></article>`;
  }).join('');
  return `<div class="cards">${depart}${cards}</div><div class="legend"><span><span class="badge sm">a</span> prélèvement : sa place sur la frise donne le moment, le bord droit est la sortie de l’étape</span></div>`;
};
REG.bilan = m => {
  const vd = m.contexte.volumeDepart || 0, tot = totalPreleve(m), reste = vd - tot, miss = missingCount(m), n = m.prelevements.length;
  return `<div class="row"><span class="chip">${fmtVol(vd)} mL au départ</span><span class="chip">${fmtVol(tot)} mL prélevés (${n} éch.)</span><span class="chip ${reste < 0 ? 'warn' : 'ok'}">${reste < 0 ? 'dépassement de ' + fmtVol(-reste) + ' mL' : fmtVol(reste) + ' mL restants'}</span>${miss ? `<span class="chip warn">${miss} numéro${miss > 1 ? 's' : ''} à saisir</span>` : ''}</div>`;
};

REG.lancement = m => {
  const n = m.journal.length;
  if (!m.lancee) return `<div class="lanc"><div><b>Manip pas encore lancée</b><div class="hint">Quand elle démarre, lance-la : chaque modification sera ensuite notée avec la date, l’heure et ton nom.</div></div><button class="btn primary" data-act="lancer">▶ Lancer la manip</button></div>`;
  return `<div class="lanc on"><div><b>Manip lancée le ${fmtDT(m.lancee.le)} par ${esc(m.lancee.par)}</b><div class="row" style="margin-top:6px">${n ? `<span class="chip warn">⚠ Modifiée après lancement · ${n} modification${n > 1 ? 's' : ''}</span><button class="btn sm" data-act="open-journal">Voir le journal</button>` : `<span class="chip ok">Aucune modification depuis le lancement</span><button class="btn sm" data-act="annuler-lancement">Annuler le lancement</button>`}</div></div></div>`;
};
function fluxHtml(m) {
  const c = m.contexte, def = S.ui.mode === 'def';
  return `
  ${region('lancement', REG.lancement(m))}
  <section class="panel"><h2>Ma demande</h2>
    <div class="grid g3">
      <div class="fld"><label for="c-do">Donneur d’ordre</label><select id="c-do" data-bind="c:donneur"><option value="">Choisir…</option>${S.data.donneurs.concat(c.donneur && !S.data.donneurs.includes(c.donneur) ? [c.donneur] : []).map(d => `<option value="${esc(d)}" ${d === c.donneur ? 'selected' : ''}>${esc(d)}</option>`).join('')}</select></div>
      <div class="fld"><label for="c-ref">Référence de la demande</label><input id="c-ref" class="mono" data-bind="c:ref" value="${esc(c.ref)}" placeholder="n° ?"></div>
      <div class="fld"><label for="c-vol">Volume de départ (mL)</label><input id="c-vol" class="mono" inputmode="decimal" data-bind="c:volumeDepart" value="${c.volumeDepart ?? ''}"></div>
    </div>

      <div class="fld"><label for="c-op">Opérateur (ton nom)</label><input id="c-op" data-bind="c:operateur" value="${esc(c.operateur || '')}" placeholder="Ex. Pierre"></div>
    </div>
    ${isTest(c) ? `<div class="fld"><label for="c-id">Idée testée</label><input id="c-id" data-bind="c:idee" value="${esc(c.idee)}" placeholder="Hypothèse ou référence de l’idée"></div>` : ''}
    <div class="fld"><label for="c-ob">Objectif</label><input id="c-ob" data-bind="c:objectif" value="${esc(c.objectif)}" placeholder="Ex. Réduire les FFA à moins de 2 %"></div>
    <div class="fld"><label for="c-px">Contexte (facultatif)</label><textarea id="c-px" class="ta ctx" data-bind="c:precisions" placeholder="Origine de la demande, contraintes, remarques…">${esc(c.precisions)}</textarea></div>
    <div class="fld"><span class="lbl">Tags</span><div class="tgs" style="margin:4px 0">${(m.tags || []).map(t => `<span class="chipx">#${esc(t)}<button data-act="del-tag" data-k="${esc(t)}" aria-label="Retirer le tag ${esc(t)}">×</button></span>`).join('') || '<span class="hint">Aucun tag</span>'}</div>
      <div class="row"><div class="fld" style="flex:1;min-width:180px"><label for="t-new" class="sr">Nouveau tag</label><input id="t-new" list="tags-sug" placeholder="Ajouter un tag (Entrée)" autocomplete="off"><datalist id="tags-sug">${allTags().filter(t => !(m.tags || []).some(x => norm(x) === norm(t))).map(t => `<option value="${esc(t)}">`).join('')}</datalist></div><button class="btn" data-act="add-tag">Ajouter</button></div></div>
    ${region('bilan', REG.bilan(m))}</section>
  <div class="seg big" role="group" aria-label="Où en es-tu ?"><button data-act="mode" data-id="def" aria-pressed="${def}">1 · Définir le flux</button><button data-act="mode" data-id="comp" aria-pressed="${!def}">2 · Compléter les étapes</button></div>
  ${def ? defHtml(m) : compHtml(m)}`;
}
function communPanel(m) {
  const c = m.communes || {};
  const T = (key, label, on, inner) => `<div class="cond"><button class="tgl big" data-act="comm-tgl" data-k="${key}" aria-pressed="${on}">${label}</button>${on ? inner : ''}</div>`;
  return `<section class="panel"><h2>2 · Conditions communes à toutes les étapes</h2>
    <p class="hint">Active ce qui est identique partout (par exemple l’agitation), puis applique-le au flux. Tu pourras ajuster chaque étape ensuite.</p>
    <div class="conds">${T('temperature', 'Chauffage', c.temperature != null, fnum('cm-t', 'Température (°C)', 'k:temperature', c.temperature))}${T('agitation', 'Agitation', c.agitation != null, fnum('cm-a', 'Vitesse (tr/min)', 'k:agitation', c.agitation))}${T('vide', 'Sous vide', !!c.vide, fnum('cm-v', 'Pression en mbar (facultatif)', 'k:videMbar', c.vide && c.vide.mbar))}</div>

    <p class="hint">Les étapes que tu ajouteras ensuite reprennent ces conditions automatiquement.</p></section>`;
}

}

  </section>`;
}

function exportContent(M) {
  if (M.custom) return M.custom;
  if (M.fmt === 'pdf' || M.fmt === 'docx') return '';
  const ms = M.ids.map(id => S.data.manips.find(x => x.id === id)).filter(Boolean);
  if (M.fmt === 'md') return ms.map(markdown).join('\n\n---\n\n');
  if (M.fmt === 'html') return ms.length === 1 ? reportHtml(ms[0]) : ms.map(reportHtml).join('\n');

/* ====================== actions ====================== */
function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => { el.style.display = 'none'; }, 2200); }
async function copyText(text, msg) { try { await navigator.clipboard.writeText(text); toast(msg || 'Copié'); return true; } catch (e) { return false; } }
async function saveFile(name, data) {
  if (!S.persist.dl) { toast('Téléchargement indisponible ici : utilise Copier'); return; }
  try { await S.persist.dl.save({ filename: name, data }); toast('Fichier enregistré'); } catch (e) { if (!e || e.code !== 'declined') toast('Téléchargement impossible : utilise Copier'); }
}
function duplicate(m) {

  c.etapes.forEach(e => { const n = uid(); map[e.id] = n; e.id = n; });
  c.prelevements.forEach(p => { p.id = uid(); if (p.etapeId) p.etapeId = map[p.etapeId]; p.scirius = ''; p.aramis = ''; });
  S.data.manips.push(c); return c;
}
function openManip(id) { const m = S.data.manips.find(x => x.id === id); if (!m) return; S.ui.manipId = id; S.ui.stepId = DEPART; S.ui.mode = m.etapes.length ? 'comp' : 'def'; S.ui.tab = 'flux'; }

  'open-new': () => { S.ui.modal = { type: 'new' }; },

  const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${NS}><w:body>${body.join('')}<w:sectPr><w:footerReference w:type="default" r:id="rId2"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="567" w:footer="567" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const sty = (id, name, size, color, extra = '') => `<w:style w:type="paragraph" w:styleId="${id}"><w:name w:val="${name}"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/><w:pPr>${extra}</w:pPr><w:rPr><w:b/><w:color w:val="${color}"/><w:sz w:val="${size}"/></w:rPr></w:style>`;
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles ${NS}><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Segoe UI" w:hAnsi="Segoe UI" w:cs="Segoe UI"/><w:sz w:val="20"/><w:lang w:val="fr-FR"/></w:rPr></w:rPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>${sty('Title', 'Title', 40, '14201D', '<w:spacing w:after="120"/>')}${sty('Heading1', 'heading 1', 28, '0F6B5C', '<w:keepNext/><w:spacing w:before="280" w:after="100"/><w:outlineLvl w:val="0"/>')}${sty('Heading2', 'heading 2', 24, '0F6B5C', '<w:keepNext/><w:spacing w:before="200" w:after="80"/><w:outlineLvl w:val="1"/>')}${sty('Heading3', 'heading 3', 21, '14201D', '<w:keepNext/><w:spacing w:before="160" w:after="60"/><w:outlineLvl w:val="2"/>')}</w:styles>`;
  const footer = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr ${NS}><w:p><w:pPr><w:jc w:val="right"/></w:pPr>${wr('Document généré automatiquement - à relire avant diffusion   —   Page ', { size: 8, color: '566360' })}<w:r><w:rPr><w:sz w:val="16"/><w:color w:val="566360"/></w:rPr><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:rPr><w:sz w:val="16"/></w:rPr><w:instrText xml:space="preserve"> PAGE </w:instrText></w:r><w:r><w:rPr><w:sz w:val="16"/></w:rPr><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:rPr><w:sz w:val="16"/></w:rPr><w:t>1</w:t></w:r><w:r><w:rPr><w:sz w:val="16"/></w:rPr><w:fldChar w:fldCharType="end"/></w:r></w:p></w:ftr>`;

async function exportFileFor(kind, m) {
  try {
    const data = kind === 'pdf' ? buildPdf(m) : buildDocx(m);
    const mime = kind === 'pdf' ? 'application/pdf' : 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
    await saveFile(`${slug(m.nom)}.${kind === 'pdf' ? 'pdf' : 'docx'}`, new Blob([data], { type: mime }));
  } catch (e) { toast('Export impossible : ' + (e && e.message ? e.message : 'erreur')); }
}

/* ====================== événements ====================== */
const app = document.body;
app.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const f = ACT[t.dataset.act]; if (!f) return;
  const r = f(t.dataset.id, t, ev); if (r === 'skip') return;
  render();
});
let invTimer = null;
function applyBind(el) {
  const m = curManip(), parts = el.dataset.bind.split(':'), kind = parts[0], v = el.value; let redraw = false;
  const numeric = ['duree', 'temperature', 'agitation', 'filtre', 'volume', 'temps', 'volumeDepart'];
  const conv = f => numeric.includes(f) ? num(v) : v;
  if (kind === 'ui') { S.ui[parts[1]] = v; render(); const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(v.length, v.length); } return; }
  if (kind === 'm') m[parts[1]] = v;
  else if (kind === 'c') { m.contexte[parts[1]] = conv(parts[1]); if (parts[1] === 'type') redraw = true; }
  else if (kind === 's') { const x = S.data.statuts[Number(parts[1])]; x[parts[2]] = v; if (parts[2] === 'ton') redraw = true; save(); if (redraw) render(); return; }
  else if (kind === 'e') { const e = stepOf(parts[1]), f = parts[2];
    if (f === 'videMbar') { if (e.vide) e.vide.mbar = num(v); } else { e[f] = conv(f); if (f === 'operation') redraw = true; } }
  else if (kind === 'a') { stepOf(parts[1]).autres[Number(parts[2])][parts[3]] = v; }
  else if (kind === 'r') { const e = stepOf(parts[1]), k = Number(parts[2]), f = parts[3]; e.reactifs[k][f] = v;
    if (f === 'nom') redraw = true; }
  else if (kind === 'k') { m.communes = m.communes || {}; if (parts[1] === 'videMbar') { if (m.communes.vide) m.communes.vide.mbar = num(v); } else m.communes[parts[1]] = num(v); }
  else if (kind === 'l') { const l = S.data.labos[Number(parts[1])], f = parts[2];
    if (f === 'nom') { const old = l.nom; S.data.manips.forEach(mm => mm.prelevements.forEach(p => { if (p.labo === old) p.labo = v; })); l.nom = v; } else l[f] = num(v); }
  touch(m); save();
  if (redraw) render(); else refresh();
}
app.addEventListener('input', ev => { const el = ev.target; if (el.dataset && el.dataset.bind && el.tagName !== 'SELECT') applyBind(el); });
app.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.actChange === 'f-type') { S.ui.fType = el.value; render(); return; }
  if (el.dataset && el.dataset.actChange === 'exp-fmt') { S.ui.modal.fmt = el.value; paintModal(); return; }
  if (el.dataset && el.dataset.bind && el.tagName === 'SELECT') applyBind(el);
});
app.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 't-new') { ev.preventDefault(); ACT['add-tag'](); render(); return; }
  if (ev.key === 'Escape' && S.ui.modal) { S.ui.modal = null; paintModal(); } });

/* ====================== démarrage ====================== */
render();
initPersist();
</script>
